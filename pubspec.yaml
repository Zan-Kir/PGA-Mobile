name: pga_mobile
description: Sistema de Gestão de Projetos Acadêmicos - Fatec Votorantim
publish_to: 'none'
version: 1.8.2+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  go_router: ^12.1.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  fl_chart: ^1.1.1
  flutter_svg: ^2.2.3
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  http: ^1.6.0
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^7.0.0
  package_info_plus: ^9.0.0
  share_plus: ^12.0.1
  flutter_file_dialog: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.14.4"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#ffffff"
